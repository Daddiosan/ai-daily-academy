name: AI Daily Academy

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Specific curriculum day (1-168). Leave blank for next day."
        required: false
        type: string
  schedule:
    - cron: "0 21 * * *" # 05:00 JST

permissions:
  contents: write

concurrency:
  group: ai-daily-academy
  cancel-in-progress: false

jobs:
  build-daily-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LESSON_MODEL: gpt-5.6-terra
        run: |
          if [ -n "${{ inputs.day }}" ]; then
            python scripts/create_lesson.py --day "${{ inputs.day }}"
          else
            python scripts/create_lesson.py
          fi

      - name: Create MP3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_MODEL: gpt-4o-mini-tts
          TTS_VOICE: marin
        run: python scripts/create_audio.py

      - name: Collect outputs
        id: outputs
        shell: bash
        run: |
          TXT=$(ls -t lessons/day_*.txt | head -n 1)
          MP3=$(ls -t lessons/day_*.mp3 | head -n 1)
          JSON="${TXT%.txt}.json"
          echo "txt=$TXT" >> "$GITHUB_OUTPUT"
          echo "mp3=$MP3" >> "$GITHUB_OUTPUT"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-academy-${{ github.run_number }}
          path: |
            ${{ steps.outputs.outputs.txt }}
            ${{ steps.outputs.outputs.mp3 }}
            ${{ steps.outputs.outputs.json }}
          retention-days: 30

      - name: Save progress and text
        if: ${{ inputs.day == '' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/progress.json lessons/*.txt lessons/*.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add AI Daily Academy lesson"
            git pull --rebase origin main
            git push origin main
          fi
