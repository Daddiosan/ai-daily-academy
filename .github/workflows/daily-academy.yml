name: AI Daily Academy

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Specific curriculum day (1-168). Leave blank for next day."
        required: false
        type: string

      reset_to_day1:
        description: "Reset progress and restart from Day 1"
        required: false
        default: false
        type: boolean

  schedule:
    # 05:00 JST
    # GitHub Actions cron uses UTC.
    # 20:00 UTC = 05:00 JST next day.
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: ai-daily-academy
  cancel-in-progress: false

jobs:
  build-daily-lesson:
    runs-on: ubuntu-latest

    # Safety margin for temporary GitHub runner / network delays.
    timeout-minutes: 90

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Check / install ffmpeg
      #
      # GitHub hosted runners often already include ffmpeg.
      # If it exists, skip apt completely.
      #
      # This avoids unnecessary apt-get update/install work and
      # reduces the chance of getting stuck on a temporary package
      # mirror/network issue.
      # ------------------------------------------------------------
      - name: Check ffmpeg
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Checking ffmpeg"
          echo "=========================================="

          if command -v ffmpeg >/dev/null 2>&1; then

            echo "ffmpeg is already installed."
            echo "Skipping apt-get."

          else

            echo "ffmpeg was not found."
            echo "Installing ffmpeg..."

            sudo apt-get update
            sudo apt-get install -y ffmpeg

          fi

          echo ""
          echo "ffmpeg path:"
          command -v ffmpeg

          echo ""
          echo "ffmpeg version:"
          ffmpeg -version | head -n 1

      # ------------------------------------------------------------
      # 4. Install Python dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing Python dependencies"
          echo "=========================================="

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # 5. Create lesson
      #
      # Three modes:
      #
      # A. reset_to_day1 = true
      #    -> Reset progress and create Day 1
      #
      # B. day specified
      #    -> Create only that Day
      #       without changing progress
      #
      # C. Normal / scheduled execution
      #    -> Create next Day automatically
      # ------------------------------------------------------------
      - name: Create lesson
        id: lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LESSON_MODEL: gpt-5.6-terra
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.reset_to_day1 }}" = "true" ]; then

            echo "=========================================="
            echo " RESET MODE"
            echo " Resetting progress and creating Day 1"
            echo "=========================================="

            OUTPUT=$(python scripts/create_lesson.py --reset)

          elif [ -n "${{ inputs.day }}" ]; then

            echo "=========================================="
            echo " MANUAL DAY MODE"
            echo " Creating specified curriculum day:"
            echo "${{ inputs.day }}"
            echo "=========================================="

            OUTPUT=$(python scripts/create_lesson.py \
              --day "${{ inputs.day }}")

          else

            echo "=========================================="
            echo " AUTOMATIC MODE"
            echo " Creating next curriculum day automatically"
            echo "=========================================="

            OUTPUT=$(python scripts/create_lesson.py)

          fi

          echo "$OUTPUT"

          LESSON_PATH=$(echo "$OUTPUT" \
            | sed -n 's/^LESSON_PATH=//p' \
            | tail -n 1)

          META_PATH=$(echo "$OUTPUT" \
            | sed -n 's/^META_PATH=//p' \
            | tail -n 1)

          if [ -z "$LESSON_PATH" ]; then
            echo "ERROR: LESSON_PATH was not returned."
            exit 1
          fi

          if [ ! -f "$LESSON_PATH" ]; then
            echo "ERROR: Lesson file does not exist:"
            echo "$LESSON_PATH"
            exit 1
          fi

          echo "lesson_path=$LESSON_PATH" >> "$GITHUB_OUTPUT"
          echo "meta_path=$META_PATH" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Lesson created:"
          echo "$LESSON_PATH"

      # ------------------------------------------------------------
      # 6. Create MP3
      # ------------------------------------------------------------
      - name: Create MP3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_MODEL: gpt-4o-mini-tts
          TTS_VOICE: marin
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Creating MP3"
          echo "=========================================="

          python scripts/create_audio.py \
            --lesson "${{ steps.lesson.outputs.lesson_path }}"

      # ------------------------------------------------------------
      # 7. Create PDF
      # ------------------------------------------------------------
      - name: Create PDF
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Creating PDF"
          echo "=========================================="

          python scripts/create_pdf.py \
            --lesson "${{ steps.lesson.outputs.lesson_path }}"

      # ------------------------------------------------------------
      # 8. Collect generated output paths
      # ------------------------------------------------------------
      - name: Collect outputs
        id: outputs
        shell: bash
        run: |
          set -euo pipefail

          TXT="${{ steps.lesson.outputs.lesson_path }}"
          MP3="${TXT%.txt}.mp3"
          PDF="${TXT%.txt}.pdf"
          JSON="${TXT%.txt}.json"

          test -f "$TXT"
          test -f "$MP3"
          test -f "$PDF"
          test -f "$JSON"

          echo "txt=$TXT" >> "$GITHUB_OUTPUT"
          echo "mp3=$MP3" >> "$GITHUB_OUTPUT"
          echo "pdf=$PDF" >> "$GITHUB_OUTPUT"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Generated files:"
          ls -lh "$TXT"
          ls -lh "$MP3"
          ls -lh "$PDF"
          ls -lh "$JSON"

      # ------------------------------------------------------------
      # 9. Determine curriculum Day number
      # ------------------------------------------------------------
      - name: Determine Day number
        id: dayinfo
        shell: bash
        run: |
          set -euo pipefail

          TXT="${{ steps.outputs.outputs.txt }}"

          FILE=$(basename "$TXT")

          DAY_ID=$(echo "$FILE" \
            | sed -n 's/^\(day_[0-9][0-9][0-9]\)_.*/\1/p')

          if [ -z "$DAY_ID" ]; then
            echo "ERROR: Could not determine Day number."
            echo "Filename:"
            echo "$FILE"
            exit 1
          fi

          echo "day_id=$DAY_ID" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Curriculum Day:"
          echo "$DAY_ID"

      # ------------------------------------------------------------
      # 10. Upload GitHub Actions artifact
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-academy-${{ github.run_number }}
          path: |
            ${{ steps.outputs.outputs.txt }}
            ${{ steps.outputs.outputs.mp3 }}
            ${{ steps.outputs.outputs.pdf }}
            ${{ steps.outputs.outputs.json }}
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------
      # 11. Create permanent Day-number archive
      # ------------------------------------------------------------
      - name: Update Day archive
        shell: bash
        run: |
          set -euo pipefail

          TXT="${{ steps.outputs.outputs.txt }}"
          MP3="${{ steps.outputs.outputs.mp3 }}"
          PDF="${{ steps.outputs.outputs.pdf }}"
          JSON="${{ steps.outputs.outputs.json }}"

          DAY_ID="${{ steps.dayinfo.outputs.day_id }}"

          mkdir -p lessons/by-day

          cp "$TXT"  "lessons/by-day/${DAY_ID}.txt"
          cp "$MP3"  "lessons/by-day/${DAY_ID}.mp3"
          cp "$PDF"  "lessons/by-day/${DAY_ID}.pdf"
          cp "$JSON" "lessons/by-day/${DAY_ID}.json"

          echo ""
          echo "Day archive updated:"

          ls -lh "lessons/by-day/${DAY_ID}.txt"
          ls -lh "lessons/by-day/${DAY_ID}.mp3"
          ls -lh "lessons/by-day/${DAY_ID}.pdf"
          ls -lh "lessons/by-day/${DAY_ID}.txt"
          ls -lh "lessons/by-day/${DAY_ID}.json"

      # ------------------------------------------------------------
      # 12. Update latest files
      #
      # Normal automatic execution:
      #   YES
      #
      # Reset to Day1:
      #   YES
      #
      # Manual specific Day:
      #   NO
      # ------------------------------------------------------------
      - name: Update latest lesson files
        if: ${{ inputs.day == '' }}
        shell: bash
        run: |
          set -euo pipefail

          TXT="${{ steps.outputs.outputs.txt }}"
          MP3="${{ steps.outputs.outputs.mp3 }}"
          PDF="${{ steps.outputs.outputs.pdf }}"
          JSON="${{ steps.outputs.outputs.json }}"

          cp "$TXT"  lessons/latest.txt
          cp "$MP3"  lessons/latest.mp3
          cp "$PDF"  lessons/latest.pdf
          cp "$JSON" lessons/latest.json

          echo ""
          echo "Latest lesson files updated:"

          ls -lh lessons/latest.txt
          ls -lh lessons/latest.mp3
          ls -lh lessons/latest.pdf
          ls -lh lessons/latest.json

      # ------------------------------------------------------------
      # 13. Save generated files
      # ------------------------------------------------------------
      - name: Save lesson files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated dated files
          git add lessons/*.txt || true
          git add lessons/*.json || true
          git add lessons/*.pdf || true
          git add lessons/*.mp3 || true

          # Permanent Day archive
          git add lessons/by-day/

          # Progress is updated for:
          #
          # 1. normal automatic execution
          # 2. reset-to-Day1 execution
          #
          # A manually specified Day does NOT update progress.
          if [ -z "${{ inputs.day }}" ]; then
            git add curriculum/progress.json
          fi

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            echo ""
            echo "Changes detected."

            git commit -m \
              "Add AI Daily Academy ${{ steps.dayinfo.outputs.day_id }}"

            git pull --rebase --autostash origin main

            git push origin main

            echo ""
            echo "Lesson successfully saved to GitHub."

          fi

      # ------------------------------------------------------------
      # 14. Completion summary
      # ------------------------------------------------------------
      - name: Show completion summary
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " AI Daily Academy generation completed"
          echo "=========================================="
          echo ""

          echo "Day:"
          echo "${{ steps.dayinfo.outputs.day_id }}"
          echo ""

          echo "Original files:"
          echo "${{ steps.outputs.outputs.txt }}"
          echo "${{ steps.outputs.outputs.mp3 }}"
          echo "${{ steps.outputs.outputs.pdf }}"
          echo "${{ steps.outputs.outputs.json }}"
          echo ""

          echo "Permanent Day archive:"
          echo "lessons/by-day/${{ steps.dayinfo.outputs.day_id }}.mp3"
          echo "lessons/by-day/${{ steps.dayinfo.outputs.day_id }}.pdf"
          echo "lessons/by-day/${{ steps.dayinfo.outputs.day_id }}.txt"
          echo "lessons/by-day/${{ steps.dayinfo.outputs.day_id }}.json"
          echo ""

          if [ "${{ inputs.reset_to_day1 }}" = "true" ]; then

            echo "RESET MODE completed."
            echo "Curriculum restarted from Day 1."
            echo ""
            echo "Next scheduled execution will create Day 2."

          elif [ -n "${{ inputs.day }}" ]; then

            echo "Manual Day generation."
            echo "latest.* files were NOT changed."
            echo "Curriculum progress was NOT changed."

          else

            echo "Automatic next-Day generation."
            echo "latest.* files were updated."

          fi
